{
  "name": "Pilot status maintenance",
  "on": {
    "schedule": [
      {
        "cron": "17 */6 * * *"
      }
    ],
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pilot-status-maintenance",
    "cancel-in-progress": false
  },
  "jobs": {
    "propose-status": {
      "if": "github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "permissions": {
        "contents": "write",
        "pull-requests": "write",
        "actions": "write"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify maintenance controls",
          "run": "python3 .github/educloud/verify.py\npython3 -m unittest discover -s tests/pilot -v"
        },
        {
          "name": "Collect bounded public metadata",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tools/pilot/status.py refresh\npython3 tools/pilot/status.py check"
        },
        {
          "name": "Retain verified proposed snapshot",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "pilot-status-proposal",
            "path": "README.md\npilot/status.json",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        },
        {
          "name": "Propose reviewed documentation only",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "python3 tools/pilot/status.py propose"
        }
      ]
    }
  }
}
