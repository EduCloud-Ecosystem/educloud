<script>

 const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
 const instances=[];
 const systemAppearance=window.matchMedia('(prefers-color-scheme: dark)');
 let appearance='light';

  appearance=['light','dark','system'].includes(choice)?choice:'light';
  const resolved=appearance==='system'?(systemAppearance.matches?'dark':'light'):appearance;

   <header class="masthead"><div class="brand">EduCloud<span>Learning Studio</span></div><div class="course-name">INFO 511 <span aria-hidden="true">/</span> Data wrangling</div><label class="appearance">Theme<select data-appearance aria-label="Appearance"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label><button data-act="course" aria-label="Show course instructions">${icon('book-open')}<span>Course</span></button><span class="avatar" aria-label="Demo learner">DL</span></header>
