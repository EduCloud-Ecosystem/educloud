<svg viewBox="0 0 1280 956" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aSky" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0284c7"/></marker>
    <marker id="aSkyB" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 Z" fill="#0369a1"/></marker>
    <marker id="aGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="aSlate" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="aSlateB" markerWidth="9" markerHeight="9" refX="1" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#64748b"/></marker>
  </defs>

  <style>
    .title{font-size:27px;font-weight:700;fill:#0f172a;}
    .sub{font-size:13px;fill:#64748b;}
    .alab{font-size:8.8px;font-weight:600;}
    .foot{font-size:11px;fill:#334155;}
    .foot2{font-size:10.5px;fill:#475569;}
    .legend{font-size:10px;fill:#64748b;}
  </style>

  <rect x="0" y="0" width="1280" height="928" fill="#eef2f7"/>
  <rect x="12" y="12" width="1256" height="900" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- title -->
  <text class="title" x="40" y="46">Quad × MESA — Integration Architecture</text>
  <text class="sub" x="40" y="69">An independent open-source project that runs on MESA’s national cyberinfrastructure — and serves as its education / outreach pillar and a flagship use-case.</text>
  <line x1="24" y1="84" x2="1256" y2="84" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== Layer A: users & git hosts ===== -->
  <rect x="40" y="104" width="560" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="136" font-size="13.5" font-weight="700" fill="#1e293b">Institutions, instructors &amp; students</text>
  <text x="60" y="158" font-size="10.5" fill="#64748b">many courses &amp; disciplines, across institutions</text>

  <rect x="680" y="104" width="560" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="700" y="128" font-size="13.5" font-weight="700" fill="#1e293b">Git hosts — the institution’s choice</text>
  <rect x="700" y="140" width="140" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="770" y="157" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">GitHub</text>
  <rect x="852" y="140" width="140" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="922" y="157" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">GitLab</text>
  <rect x="1004" y="140" width="216" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/><text x="1112" y="157" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Forgejo / Gitea (self-host)</text>

  <!-- A -> B arrows -->
  <line x1="320" y1="188" x2="270" y2="213" stroke="#64748b" stroke-width="1.3" marker-end="url(#aSlate)"/>
  <text class="alab" x="250" y="206" fill="#64748b">use</text>
  <line x1="980" y1="188" x2="1040" y2="213" stroke="#64748b" stroke-width="1.3" marker-end="url(#aSlate)" marker-start="url(#aSlateB)"/>
  <text class="alab" x="1006" y="205" fill="#64748b" text-anchor="middle">repos (provision / collect)</text>

  <!-- ===== Layer B: QUAD ===== -->
  <rect x="40" y="214" width="1200" height="238" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="60" y="240" font-size="15" font-weight="700" fill="#4338ca">QUAD — independent open-source project</text>
  <rect x="958" y="223" width="282" height="23" rx="11.5" fill="#e0e7ff" stroke="#c7d2fe"/>
  <text x="1099" y="239" font-size="9.3" font-weight="700" fill="#4338ca" text-anchor="middle">independent · own IP &amp; governance · MESA-hosted</text>

  <!-- B row 1 -->
  <rect x="60" y="252" width="360" height="84" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="80" y="282" font-size="12.5" font-weight="700" fill="#312e81">Instructor &amp; student dashboard</text>
  <text x="80" y="302" font-size="10" fill="#64748b">React / TypeScript</text>

  <rect x="460" y="252" width="360" height="84" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="480" y="280" font-size="12.5" font-weight="700" fill="#312e81">Control plane (Go) + data store</text>
  <text x="480" y="299" font-size="10" fill="#64748b">orchestration · privacy-minimal</text>
  <rect x="480" y="308" width="320" height="20" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="640" y="322" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">stores Git usernames, not student PII</text>

  <rect x="860" y="252" width="360" height="84" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="880" y="282" font-size="12.5" font-weight="700" fill="#312e81">Git-host adapters (pluggable)</text>
  <text x="880" y="302" font-size="10" fill="#64748b">GitHub · GitLab · Forgejo/Gitea</text>

  <!-- B row 2 -->
  <rect x="60" y="342" width="360" height="84" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="80" y="372" font-size="12.5" font-weight="700" fill="#312e81">Provisioning queue</text>
  <text x="80" y="392" font-size="10" fill="#64748b">rate-limit-aware · class scale</text>

  <rect x="460" y="342" width="360" height="84" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.2"/>
  <text x="480" y="368" font-size="12.5" font-weight="800" fill="#312e81">Sandboxed autograding runners</text>
  <text x="480" y="387" font-size="10" fill="#475569">ephemeral containers · host-neutral spec</text>
  <text x="480" y="406" font-size="9.5" font-weight="700" fill="#4f46e5">→ executes on MESA compute</text>

  <rect x="860" y="342" width="360" height="84" rx="10" fill="#f5f3ff" stroke="#6366f1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="880" y="366" font-size="12.5" font-weight="700" fill="#312e81">Sol peer-tutor + AI grading</text>
  <text x="880" y="385" font-size="10" fill="#64748b">Phase 5 · off by default</text>
  <text x="880" y="404" font-size="9.3" font-weight="700" fill="#6d28d9">→ MESA open-weight model serving</text>

  <text x="60" y="444" font-size="10" font-weight="600" fill="#6366f1">AGPL-3.0 control plane · Apache-2.0 interop primitives: adapter · workspace · tutor · gradingspec</text>

  <!-- ===== consume arrows B -> C ===== -->
  <line x1="168" y1="452" x2="168" y2="555" stroke="#0284c7" stroke-width="1.5" marker-end="url(#aSky)"/>
  <text class="alab" x="168" y="508" fill="#0369a1" text-anchor="middle">ACCESS allocations</text>
  <line x1="404" y1="452" x2="404" y2="555" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text class="alab" x="404" y="508" fill="#64748b" text-anchor="middle">SSO (optional)</text>
  <line x1="640" y1="452" x2="640" y2="555" stroke="#0369a1" stroke-width="2.6" marker-end="url(#aSkyB)"/>
  <text x="640" y="506" font-size="9.3" font-weight="700" fill="#0369a1" text-anchor="middle">autograding → Jetstream2</text>
  <line x1="876" y1="452" x2="876" y2="555" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#aGray)"/>
  <text class="alab" x="876" y="508" fill="#64748b" text-anchor="middle">artifacts (optional)</text>
  <line x1="1112" y1="452" x2="1112" y2="555" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#aSky)"/>
  <text class="alab" x="1112" y="508" fill="#0284c7" text-anchor="middle">AI inference (optional)</text>

  <!-- ===== Layer C: MESA platform ===== -->
  <rect x="40" y="556" width="1200" height="150" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="60" y="578" font-size="13" font-weight="700" fill="#075985">MESA — NSF IDSS national cyberinfrastructure  ·  T. Swetnam (UArizona · CyVerse / ICDI)</text>

  <rect x="60" y="592" width="216" height="98" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="168" y="620" font-size="11" font-weight="700" fill="#0c4a6e" text-anchor="middle">ACCESS SU allocations</text>
  <text x="168" y="638" font-size="9" fill="#0c4a6e" text-anchor="middle">grant · free-tier · donated · BYO</text>
  <text x="168" y="654" font-size="9" fill="#0369a1" text-anchor="middle">(the compute commons)</text>

  <rect x="296" y="592" width="216" height="98" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="404" y="620" font-size="11" font-weight="700" fill="#0c4a6e" text-anchor="middle">Federated identity</text>
  <text x="404" y="638" font-size="9" fill="#0c4a6e" text-anchor="middle">CILogon / ACCESS ID</text>
  <text x="404" y="654" font-size="9" fill="#64748b" text-anchor="middle">(optional SSO)</text>

  <rect x="532" y="592" width="216" height="98" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="640" y="620" font-size="11" font-weight="800" fill="#0c4a6e" text-anchor="middle">ACCESS-allocated compute</text>
  <text x="640" y="638" font-size="9.5" fill="#0c4a6e" text-anchor="middle">Jetstream2</text>
  <text x="640" y="654" font-size="9" fill="#0369a1" text-anchor="middle">(autograding executes here)</text>

  <rect x="768" y="592" width="216" height="98" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="876" y="620" font-size="11" font-weight="700" fill="#0c4a6e" text-anchor="middle">Object / data store</text>
  <text x="876" y="638" font-size="9" fill="#0c4a6e" text-anchor="middle">images · caches · exports</text>
  <text x="876" y="654" font-size="9" fill="#64748b" text-anchor="middle">(optional)</text>

  <rect x="1004" y="592" width="216" height="98" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="1112" y="620" font-size="11" font-weight="700" fill="#0c4a6e" text-anchor="middle">Open-weight model serving</text>
  <text x="1112" y="638" font-size="9" fill="#0c4a6e" text-anchor="middle">Jetstream2 / NAIRR</text>
  <text x="1112" y="654" font-size="9" fill="#0369a1" text-anchor="middle">(Sol &amp; AI grading)</text>

  <!-- ===== Layer D: contribution / IDSS value ===== -->
  <rect x="40" y="722" width="1200" height="112" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="60" y="746" font-size="13" font-weight="700" fill="#047857">▲  In return, Quad advances MESA’s mission — and the IDSS Category I case:</text>

  <rect x="60" y="758" width="360" height="66" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="80" y="780" font-size="11.5" font-weight="700" fill="#065f46">Education / outreach pillar</text>
  <text x="80" y="797" font-size="9" fill="#065f46">classrooms across institutions →</text>
  <text x="80" y="811" font-size="9" fill="#065f46">measurable impact + community (your MESA role)</text>

  <rect x="460" y="758" width="360" height="66" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="480" y="780" font-size="11.5" font-weight="700" fill="#065f46">Flagship use-case</text>
  <text x="480" y="797" font-size="9" fill="#065f46">containerized workloads at class scale prove</text>
  <text x="480" y="811" font-size="9" fill="#065f46">the CI serves diverse, multi-disciplinary users</text>

  <rect x="860" y="758" width="360" height="66" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="880" y="780" font-size="11.5" font-weight="700" fill="#065f46">Reusable CI primitive</text>
  <text x="880" y="797" font-size="9" fill="#065f46">host-neutral grading spec + sandboxed runner</text>
  <text x="880" y="811" font-size="9" fill="#065f46">others can adopt on the platform</text>

  <!-- ===== footer ===== -->
  <text class="legend" x="40" y="860">solid = primary integration   ·   dashed = optional   ·   indigo = Quad (independent)   ·   sky = MESA platform   ·   green = MESA mission / IDSS value</text>
  <text class="foot" x="40" y="884"><tspan font-weight="700">Why it fits IDSS:</tspan> not a single-application tool MESA funds, but a capability built on the CI + MESA’s education/outreach pillar + a multi-community use-case.</text>
  <text class="foot2" x="40" y="900">Quad consumes MESA compute &amp; model-serving; MESA gains national reach, adoption evidence, and a flagship deployment — while Quad’s IP stays independent.</text>
  <text x="24" y="946" font-size="13.5" fill="#475569">+ Registry &amp; federation layer (object catalog · Coolify deployment · Keycloak identity) — in design, a parallel workstream; federates with MESA services rather than rebuilding them.</text>
</svg>
